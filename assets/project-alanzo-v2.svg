      <text class="p4-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">Alanzo</text>
      <text class="p4-sans" x="56" y="166" font-size="17" fill="#B6A3AC">A catering brand website with menus, service packages and an enquiry flow.</text>
      <text class="p4-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> menus, service packages and an enquiry flow in a warm, responsive layout</text>
      <line class="p4-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
