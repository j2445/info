      <text class="p4-mono" x="1176" y="270" text-anchor="end" font-size="10.5" letter-spacing="1.5" fill="#B6A3AC">SEASONAL MENUS · SERVICE PACKAGES · ENQUIRY</text>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="p4-trace" style="animation-delay:-5.1s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p4-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
