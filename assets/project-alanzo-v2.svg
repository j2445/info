    <g transform="translate(261 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">Enquiry</text><text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">booking flow</text></g>
    <g transform="translate(466 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">Responsive</text><text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">mobile-first</text></g>
      <g class="p4-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="54" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="83" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">HTML</text></g><g class="p4-chip" style="animation-delay:1.12s"><rect x="118" y="314" width="50" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="143" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">CSS</text></g><g class="p4-chip" style="animation-delay:1.24s"><rect x="176" y="314" width="88" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="220" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Bootstrap</text></g><g class="p4-chip" style="animation-delay:1.36s"><rect x="272" y="314" width="95" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="319" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">JavaScript</text></g><g class="p4-chip" style="animation-delay:1.48s"><rect x="375" y="314" width="68" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="409" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">jQuery</text></g>
    </g>
    <g class="p4-in p4-d2"><g transform="translate(0 35)">
      <g transform="translate(860 30)">
        <g transform="translate(0 200)">
          <animateTransform attributeName="transform" type="translate" values="0 200; 0 200; 0 200" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#451126" fill-opacity=".92" stroke="#E5B5C7" stroke-opacity=".7" stroke-dasharray="5 4"/>
          <text class="p4-mono" x="96" y="-17" font-size="10.5" fill="#F8F0F3" transform="skewX(-38) translate(14 0)">Alanzo · catering</text>
        </g>
        <g transform="translate(0 158)">
          <animateTransform attributeName="transform" type="translate" values="0 158; 0 152; 0 158" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#27101C" fill-opacity=".92" stroke="#C77B9B" stroke-opacity=".45" />
          <text class="p4-mono" x="96" y="-17" font-size="10.5" fill="#F8F0F3" transform="skewX(-38) translate(14 0)">Menus</text>
        </g>
        <g transform="translate(0 116)">
          <animateTransform attributeName="transform" type="translate" values="0 116; 0 104; 0 116" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#27101C" fill-opacity=".92" stroke="#C77B9B" stroke-opacity=".45" />
          <text class="p4-mono" x="96" y="-17" font-size="10.5" fill="#F8F0F3" transform="skewX(-38) translate(14 0)">Service packages</text>
        </g>
        <g transform="translate(0 74)">
          <animateTransform attributeName="transform" type="translate" values="0 74; 0 56; 0 74" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#27101C" fill-opacity=".92" stroke="#C77B9B" stroke-opacity=".45" />
          <text class="p4-mono" x="96" y="-17" font-size="10.5" fill="#F8F0F3" transform="skewX(-38) translate(14 0)">Enquiry flow</text>
        </g>
