<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p3-t">
  <title id="p3-t">Linkin Park: A music band website with discography, tour dates and media.</title>
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p3-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p3-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <filter id="p3-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p3-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p3-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p3-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p3-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p3-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p3-in { animation: p3-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p3-d1 { animation-delay: .15s; } .p3-d2 { animation-delay: .4s; }
    .p3-chip { animation: p3-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p3-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p3-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p3-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p3-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p3-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p3-in, .p3-chip { animation: none; } .p3-draw { animation: none; stroke-dashoffset: 0; } }
    .p3-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p3-trace 7s linear infinite; }
    @keyframes p3-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p3-trace { display: none; } }
  </style>
  <g clip-path="url(#p3-clip)">
    <rect width="1200" height="370" fill="url(#p3-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p3-grid)"/>
    <rect width="1200" height="370" fill="url(#p3-glow)"/>
    <g class="p3-in p3-d1">
      <text class="p3-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">03 · WEB · MUSIC · BAND SITE · 2026</text>
      <text class="p3-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">Linkin Park<tspan class="p3-serif" font-size="22" font-style="italic" fill="#E5B5C7" dx="14">Band Website</tspan></text>
      <text class="p3-sans" x="56" y="166" font-size="17" fill="#B6A3AC">A music band website with discography, tour dates and media.</text>
      <text class="p3-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> discography, tour dates and media in a fast, responsive fan experience</text>
      <line class="p3-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
    <g transform="translate(56 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#F8F0F3">Discography</text><text class="p3-sans" y="24" font-size="12.5" fill="#B6A3AC">albums &amp; tracks</text></g>
    <g transform="translate(261 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#F8F0F3">Tour dates</text><text class="p3-sans" y="24" font-size="12.5" fill="#B6A3AC">upcoming shows</text></g>
    <g transform="translate(466 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#F8F0F3">Media</text><text class="p3-sans" y="24" font-size="12.5" fill="#B6A3AC">gallery &amp; video</text></g>
      <g class="p3-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="54" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="83" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">HTML</text></g><g class="p3-chip" style="animation-delay:1.12s"><rect x="118" y="314" width="50" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="143" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">CSS</text></g><g class="p3-chip" style="animation-delay:1.24s"><rect x="176" y="314" width="95" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="223" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">JavaScript</text></g><g class="p3-chip" style="animation-delay:1.36s"><rect x="279" y="314" width="88" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="323" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Bootstrap</text></g><g class="p3-chip" style="animation-delay:1.48s"><rect x="375" y="314" width="61" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="405" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Media</text></g><g class="p3-chip" style="animation-delay:1.60s"><rect x="444" y="314" width="95" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="491" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Responsive</text></g>
    </g>
    <g class="p3-in p3-d2"><g transform="translate(0 35)">
      <g>
        <rect x="760" y="50" width="250" height="38" rx="12" fill="#F8F0F3" fill-opacity=".07" stroke="#C77B9B" stroke-opacity=".3"/>
        <text class="p3-mono" x="776" y="74" font-size="12" fill="#F8F0F3">“tour dates 2026”</text>
        <g transform="translate(760 112)">
          <rect width="76" height="58" rx="9" fill="#27101C" stroke="#C77B9B" stroke-opacity=".3">
            <animate attributeName="fill" values="#27101C;#701A3D;#27101C;#27101C" keyTimes="0;.08;.2;1" dur="6s" begin="1.0s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="1.0s" repeatCount="indefinite"/>
          </rect>
          <text class="p3-mono" x="8" y="18" font-size="9" fill="#B6A3AC">01</text>
          <text class="p3-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#F8F0F3">Home</text>
        </g>
        <g transform="translate(844 112)">
          <rect width="76" height="58" rx="9" fill="#27101C" stroke="#C77B9B" stroke-opacity=".3">
            <animate attributeName="fill" values="#27101C;#701A3D;#27101C;#27101C" keyTimes="0;.08;.2;1" dur="6s" begin="1.6s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="1.6s" repeatCount="indefinite"/>
          </rect>
          <text class="p3-mono" x="8" y="18" font-size="9" fill="#B6A3AC">02</text>
          <text class="p3-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#F8F0F3">Music</text>
        </g>
        <g transform="translate(928 112)">
          <rect width="76" height="58" rx="9" fill="#27101C" stroke="#C77B9B" stroke-opacity=".3">
            <animate attributeName="fill" values="#27101C;#701A3D;#27101C;#27101C" keyTimes="0;.08;.2;1" dur="6s" begin="2.2s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="2.2s" repeatCount="indefinite"/>
          </rect>
          <text class="p3-mono" x="8" y="18" font-size="9" fill="#B6A3AC">03</text>
          <text class="p3-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#F8F0F3">Tour</text>
        </g>
        <g transform="translate(1012 112)">
          <rect width="76" height="58" rx="9" fill="#27101C" stroke="#C77B9B" stroke-opacity=".3">
            <animate attributeName="fill" values="#27101C;#701A3D;#27101C;#27101C" keyTimes="0;.08;.2;1" dur="6s" begin="2.8s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="2.8s" repeatCount="indefinite"/>
          </rect>
          <text class="p3-mono" x="8" y="18" font-size="9" fill="#B6A3AC">04</text>
          <text class="p3-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#F8F0F3">Media</text>
        </g>
        <g transform="translate(1096 112)">
          <rect width="76" height="58" rx="9" fill="#27101C" stroke="#C77B9B" stroke-opacity=".3">
            <animate attributeName="fill" values="#27101C;#701A3D;#27101C;#27101C" keyTimes="0;.08;.2;1" dur="6s" begin="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="3.4s" repeatCount="indefinite"/>
          </rect>
          <text class="p3-mono" x="8" y="18" font-size="9" fill="#B6A3AC">05</text>
          <text class="p3-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#F8F0F3">Contact</text>
        </g>
        <text class="p3-mono" x="1176" y="214" font-size="12" text-anchor="end" fill="#E5B5C7">tour → upcoming shows · next: London</text>
        <text class="p3-mono" x="1176" y="240" font-size="10.5" text-anchor="end" letter-spacing="1.5" fill="#B6A3AC">RESPONSIVE · FAST · FAN-FIRST</text>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="p3-trace" style="animation-delay:-3.4s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p3-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
